import os
import shlex
import sys

config.unsupported = os.environ.get("TTMLIR_TEST_DATAFLOW_HARDWARE") != "1"
if not config.unsupported:
    for variable in ("DEVICE_BDF", "TT_METAL_HOME"):
        if not os.environ.get(variable):
            lit_config.fatal(f"{variable} is required for the hardware test")
    for variable in (
        "HOME", "USER", "PYTHONPATH", "LD_LIBRARY_PATH", "TT_METAL_LOCAL_ONLY",
        "TT_METAL_HOME", "TT_METAL_RUNTIME_ROOT", "TT_METAL_RUNTIME_ROOT_EXTERNAL",
    ):
        if variable in os.environ:
            config.environment[variable] = os.environ[variable]
    config.substitutions.append(("%dataflow_python", shlex.quote(sys.executable)))
    config.substitutions.append(("%dataflow_device", shlex.quote(os.environ["DEVICE_BDF"])))
    config.substitutions.append(("%dataflow_metal", shlex.quote(os.environ["TT_METAL_HOME"])))
